name: "Test report"
description: >-
  Report JUnit results as a job summary, a check run with annotations and one
  PR comment per title that each run updates, and upload the JUnit files as an
  artifact. Reporting only: it never fails because a test failed, and it skips
  the check and the comment when the job's token can't write them (Dependabot,
  or a caller that narrowed `permissions:`) instead of erroring.

inputs:
  junit-path:
    description: JUnit XML file(s); newline-separated globs, `**` allowed.
    required: true
  title:
    description: >-
      Names the check run and identifies the PR comment, so it must be unique
      among the reports on one PR, e.g. `Go tests (bookings-core)`.
    required: true
  artifact-name:
    description: Artifact the JUnit files are uploaded as; unique within the workflow run.
    required: false
    default: test-results
  go-module-dir:
    description: >-
      Directory of the Go module (with its go.mod) the results come from. Points
      each failure's annotation at the `_test.go` line it reports; without it the
      reporter guesses a path from the package name, which matches no file.
    required: false
    default: ""
  token:
    description: Token for the check run and the comment.
    required: false
    default: ${{ github.token }}

outputs:
  tests:
    description: Number of test cases found.
    value: ${{ steps.count.outputs.tests }}
  failed:
    description: Number of failed test cases.
    value: ${{ steps.count.outputs.failed }}

runs:
  using: "composite"
  steps:
    - name: Count the results
      id: count
      shell: bash
      env:
        PATTERNS: ${{ inputs.junit-path }}
        GO_MODULE_DIR: ${{ inputs.go-module-dir }}
      run: |
        dir=$(mktemp -d "$RUNNER_TEMP/test-report.XXXXXX")
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        python3 -I "$GITHUB_ACTION_PATH/report.py" "$PATTERNS" "$dir/slowest.md" "$GO_MODULE_DIR"

    # The JUnit reporter turns a missing permission into an error annotation (check)
    # or a failed step (comment), so ask first, with requests that change nothing.
    # Updating check run 0 gets 404 with checks: write and 403 without. Removing a
    # label the PR doesn't have gets 404 with pull-requests: write and 403 without.
    # (Updating comment 0 doesn't work as a probe: it gets 404 either way.)
    - name: Check what the token may write
      id: access
      if: steps.count.outputs.tests > 0
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        allowed() {
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X "$1" \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$2") || true
          echo "$1 $2 -> ${code:-none}" >&2
          [ "$code" = 404 ]
        }
        checks=false comment=false
        allowed PATCH check-runs/0 && checks=true
        # Never comment without the check: a read-only token gets neither.
        if [ "$checks" = true ] && [ -n "$PR" ] && allowed DELETE "issues/$PR/labels/test-report-permission-probe"; then
          comment=true
        fi
        echo "checks=$checks" >> "$GITHUB_OUTPUT"
        echo "comment=$comment" >> "$GITHUB_OUTPUT"

    - name: Publish the report
      if: steps.count.outputs.tests > 0
      # v6.7.1
      uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce
      with:
        token: ${{ inputs.token }}
        report_paths: ${{ inputs.junit-path }}
        check_name: ${{ inputs.title }}
        annotate_only: ${{ steps.access.outputs.checks != 'true' }}
        comment: ${{ steps.access.outputs.comment == 'true' }}
        updateComment: "true"
        job_summary: "true"
        # Raw HTML: the reporter appends its table straight after this text.
        job_summary_text: "<h3>${{ inputs.title }}</h3>"
        detailed_summary: "true"
        failed_summary_logs: "true"
        include_passed: "false"
        include_skipped: "false"
        include_time_in_summary: "true"
        fail_on_failure: "false"
        fail_on_parse_error: "false"
        require_tests: "false"

    - name: Add the slowest tests to the summary
      if: always()
      shell: bash
      env:
        TITLE: ${{ inputs.title }}
        PATTERNS: ${{ inputs.junit-path }}
        TESTS: ${{ steps.count.outputs.tests }}
        DIR: ${{ steps.count.outputs.dir }}
        CHECKS: ${{ steps.access.outputs.checks }}
        COMMENT: ${{ steps.access.outputs.comment }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        {
          if [ "${TESTS:-0}" -eq 0 ]; then
            printf '### %s\n\nNo test results found in `%s`.\n\n' "$TITLE" "$PATTERNS"
          else
            [ -s "$DIR/slowest.md" ] && cat "$DIR/slowest.md"
            if [ "$CHECKS" != true ] || { [ -n "$PR" ] && [ "$COMMENT" != true ]; }; then
              echo "> This job's token can't write checks or PR comments (Dependabot, or the caller narrowed \`permissions:\`), so the report is only here."
              echo
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the JUnit files
      if: always() && steps.count.outputs.files > 0
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.junit-path }}
        if-no-files-found: ignore
        overwrite: true
