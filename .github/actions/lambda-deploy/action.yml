name: 'Lambda Deploy'
description: 'Deploy a docker image to a lambda function'
inputs:
# Github access
  aws_function_name:
    description: "what is the function called"
    required: true
  image_tag_prefix:
    description: "which tag to use"
    required: true
  ecr_repository_name:
    description: "ecr repository name"
    required: true
# Aws
  aws_access_key_id:
    required: true
    secret: true
  aws_secret_access_key:
    required: true
    secret: true
  aws_region:
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}
    -
      name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Setup aws role arn
      id: setup-aws-role-arn
      shell: bash
      env:
        IMAGE_TAG_PREFIX: ${{ inputs.image_tag_prefix }}
      run: |
        if [ "$IMAGE_TAG_PREFIX" = "prod-" ]; then
          ROLE_ARN="arn:aws:iam::189949407637:role/ContinuousDeliveryRole"
        else
          ROLE_ARN="arn:aws:iam::115578597962:role/ContinuousDeliveryRole"
        fi
        echo "ROLE_TO_ASSUME=$ROLE_ARN" >> $GITHUB_ENV
    - name: Configure AWS credentials
      env:
        ROLE_TO_ASSUME: ${{ env.ROLE_TO_ASSUME }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ env.ROLE_TO_ASSUME }}
        role-duration-seconds: 900
    - name: Check if lambda function exists
      shell: bash
      id: check_lambda
      run: |
        if aws lambda get-function --function-name ${{ inputs.aws_function_name }} > /dev/null 2>&1; then
          echo "LAMBDA_EXISTS=true" >> $GITHUB_ENV
        else
          echo "LAMBDA_EXISTS=false" >> $GITHUB_ENV
        fi
    - name: Update lambda image uri
      shell: bash
      env:
        LAMBDA_EXISTS: ${{ env.LAMBDA_EXISTS }}
        FUNCTION_NAME: ${{ inputs.aws_function_name }}
        IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository_name }}:${{ inputs.image_tag_prefix }}latest
      if: env.LAMBDA_EXISTS == 'true'
      run: |
        # Branches building in parallel deploy the same function, and Lambda
        # rejects an update while another is in progress
        # (ResourceConflictException). Wait for the running update, then try
        # again, as ci-go-mise-lambda does. The wait is bounded so three
        # attempts fit inside the job.
        for attempt in 1 2 3; do
          timeout 90 aws lambda wait function-updated --function-name "$FUNCTION_NAME" || true
          rc=0
          output=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_URI" 2>&1) || rc=$?
          echo "$output"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if ! grep -q ResourceConflictException <<< "$output"; then
            exit "$rc"
          fi
          echo "Another update is in progress; retrying (attempt $attempt of 3)"
        done
        exit 1
