name: CI

on:
  workflow_call:
    secrets:
      go-private-modules-pat:
        required: true
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 15
      localstack:
        type: boolean
        required: false
        default: false
      localstack-version:
        type: string
        required: false
        default: "4.2.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Runner images ship an older baked-in Go than what mise.toml/go.mod
      # pin. mise resolves go:-backend tool versions (e.g. sprt) by shelling
      # out to `go list -m`, which enforces the current module's go.mod floor
      # regardless of which module is queried -- on a cold mise cache, that
      # runs before mise's own pinned go tool has installed, against the
      # stale runner default, and fails with a misleading "no versions found"
      # error. Installing a go.mod-satisfying toolchain first removes the
      # race entirely.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup access to private Go modules
        env:
          GO_PRIVATE_MODULES_PAT: ${{ secrets.go-private-modules-pat }}
        run: |
          git config --global \
            url."https://understory-services:${GO_PRIVATE_MODULES_PAT}@github.com/understory-io".insteadOf \
            "https://github.com/understory-io"
          # Tell Go to treat these modules as private (skip proxy and checksum verification)
          # Required for Mise to install Go tools from private repos
          echo "GOPRIVATE=github.com/understory-io/*" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/understory-io/*" >> $GITHUB_ENV

      - name: Install Mise
        uses: jdx/mise-action@v4

      # Go caching strategy is based on https://danp.net/posts/github-actions-go-cache/
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # always grab from the restore-keys pattern below,
          # like Linux-go-$hash-YYYY-MM-DD as saved by CI
          key: nonexistent
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-

      - name: Pull dependencies
        run: go mod download && go mod tidy

      - name: Restore LocalStack Docker image cache
        if: ${{ inputs.localstack }}
        uses: actions/cache@v5
        with:
          path: /tmp/localstack-image.tar
          key: localstack-image-${{ runner.os }}-${{ inputs.localstack-version }}

      - name: Load or pull LocalStack Docker image
        if: ${{ inputs.localstack }}
        run: |
          if [ -f /tmp/localstack-image.tar ]; then
            docker load -i /tmp/localstack-image.tar
          else
            docker pull localstack/localstack:${{ inputs.localstack-version }}
            docker save localstack/localstack:${{ inputs.localstack-version }} -o /tmp/localstack-image.tar
          fi

      - name: Start LocalStack and run migrations
        if: ${{ inputs.localstack }}
        run: mise run local:up

      # The output is also kept for the test report; pipefail keeps mise's exit code.
      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          mise run test 2>&1 | tee "$RUNNER_TEMP/go-test.log"
        env:
          GOFLAGS: "-mod=readonly"

      # Reporting never decides the build; see ci-go-mise-lambda.yml.
      - name: Convert test output to JUnit
        id: junit
        if: always() && steps.tests.outcome != 'skipped'
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/go-test.log" ] || exit 0
          GOFLAGS='' GOBIN="$RUNNER_TEMP/bin" go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          mkdir -p "$RUNNER_TEMP/test-results"
          "$RUNNER_TEMP/bin/go-junit-report" -in "$RUNNER_TEMP/go-test.log" -out "$RUNNER_TEMP/test-results/go-test.xml"
          echo "path=$RUNNER_TEMP/test-results/go-test.xml" >> "$GITHUB_OUTPUT"

      # See ci-go-mise-lambda.yml for why the action is checked out here.
      - name: Checkout the test-report action
        if: always() && steps.junit.outputs.path != ''
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository || 'understory-io/workflows' }}
          ref: ${{ job.workflow_sha || 'main' }}
          path: .understory-workflows
          sparse-checkout: .github/actions/test-report
          persist-credentials: false

      - name: Report test results
        if: always() && steps.junit.outputs.path != ''
        continue-on-error: true
        uses: ./.understory-workflows/.github/actions/test-report
        with:
          junit-path: ${{ steps.junit.outputs.path }}
          go-module-dir: .
          title: Go tests

      - name: Build module
        run: mise run build
        env:
          GOFLAGS: "-mod=readonly"

        # experimental improved cache strategy
      - name: Trim Go cache
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        # As the go command works, it either creates build cache files or touches
        # ones it uses at most once an hour. When it trims the cache, it trims
        # files that have not been modified/touched in 5+ days.
        # To keep our saved cache lean, trim all files except ones that were just
        # created/touched as part of this run.
        run: |
          find ~/.cache/go-build -type f -mmin +90 -delete

      - name: Set Go cache date
        shell: bash
        run: echo "GO_CACHE_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Save Go cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          # Caches both the downloaded modules and the compiled build cache.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Save to eg Linux-go-$hash-YYYY-MM-DD to keep the cache fresh
          key: "${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ env.GO_CACHE_DATE }}"
