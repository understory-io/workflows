name: Update release PRs
on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 5
      promotionPairs:
        type: string
        required: true
        description: "Comma-separated list of key-value promotion pairs to create PRs for, e.g. 'dev=prod'"
      prepare_command:
        type: string
        required: false
        default: ""
        description: "Mise task run after the reset and before the pull request, so whatever it writes is committed with the promotion (e.g. code generation)"
      record_target_ancestry:
        type: boolean
        required: false
        default: false
        description: "Give the promotion branch the target branch as a second parent while keeping the source tree byte-for-byte. Set this when the target carries content the source never sees — a file the promotion itself generates — which otherwise conflicts on every cycle. Reverts anything committed straight to the target"
    secrets:
      token:
        required: true

jobs:
  release-prs:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    name: Update release PRs

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Detect target branch
        id: detect-target-branch
        run: |
          IFS=',' read -r -a pairs <<< '${{ inputs.promotionPairs}}'

          target_branch="unknown"

          # expand the configuration variable. It contains comma separated key-value pairs
          # for <origin_branch>=<target_branch> mappings.
          for pair in "${pairs[@]}"; do
              key="${pair%%=*}"
              value="${pair##*=}"
              if [[ '${{ github.ref_name }}' == "$key" ]]; then
                  target_branch="$value"
                  break
              fi
          done

          if [[ "$target_branch" == "unknown" ]]; then
              echo "Target branch is unknown. Check the branch configuration."
              exit 1
          fi

          echo "TARGET_BRANCH=$target_branch" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}
          # At the action's default depth of 1 the ancestry merge below sees unrelated histories.
          fetch-depth: 0

      - name: Reset ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }} promotion branch
        run: |
          git fetch origin ${{ github.ref_name }}:${{ github.ref_name }}
          git reset --hard ${{ github.ref_name }}

      # Without this the merge base is the previous promotion, so last cycle's `prepare_command`
      # output conflicts add/add with this one's. `--strategy=ours` keeps the tree the source's.
      - name: Record ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }} as an ancestor
        if: inputs.record_target_ancestry
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}
        run: |
          set -euo pipefail

          # The runner has no git identity, and a merge commit needs one. Borrow create-pull-request's.
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              merge --strategy=ours --no-edit \
              -m "Record $TARGET_BRANCH as an ancestor of $SOURCE_BRANCH" \
              "origin/$TARGET_BRANCH"

      # Between the reset and the pull request because `create-pull-request` commits whatever is dirty:
      # a second push would move the head sha out from under a status already posted on it.
      - name: Install Mise
        if: inputs.prepare_command != ''
        uses: jdx/mise-action@v4

      - name: Prepare the promotion commit
        if: inputs.prepare_command != ''
        run: ${{ inputs.prepare_command }}

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.token }}
          branch: release/auto-${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}
          commit-message: |
            Merge ${{ github.ref_name }} into ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}
          title: "Release ${{ github.ref_name }} to ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}"
          body: |
            Automated PR for releasing changes from ${{ github.ref_name }} into ${{ steps.detect-target-branch.outputs.TARGET_BRANCH }}
          maintainer-can-modify: false
          delete-branch: true
