name: "tests-passed self-test"

# Runs the gate's script against a mocked checks API, so a change to how it
# reads results can't quietly turn the gate green on failures. No paths
# filter, so its check reports on every PR and a ruleset can require it.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-passed-selftest:
    name: "tests-passed-selftest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the scenarios
        run: node test/tests-passed.mjs .github/workflows/tests-passed.yml
