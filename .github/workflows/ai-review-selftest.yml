name: "AI review self-test"

# Tests the review script and the workflow's safety rules (pinned actions, nothing fails in advisory mode,
# Claude Code gets only read tools and only its key). Needs no API key.

on:
  pull_request:
    paths:
      - ".github/ai-review/**"
      - ".github/workflows/ai-review.yml"
      - ".github/workflows/ai-review-selftest.yml"
      - "test/ai-review.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/ai-review/**"
      - ".github/workflows/ai-review.yml"
      - ".github/workflows/ai-review-selftest.yml"
      - "test/ai-review.mjs"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run the tests
        env:
          # For rendering a hostile comment through GitHub's markdown API.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git --version
          node test/ai-review.mjs
