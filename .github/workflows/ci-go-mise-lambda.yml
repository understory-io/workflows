name: CI Go Mise Lambda

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 20
      app_name:
        description: "Application name, used as the artifact name"
        required: true
        type: string
      app_dir:
        description: "Path to the application directory (e.g. apps/bookings-core)"
        required: true
        type: string
      localstack_image:
        description: "LocalStack Docker image to use"
        required: false
        type: string
        default: localstack/localstack:4.2.0
      enable_localstack:
        description: "Whether to start LocalStack for integration tests"
        required: false
        type: boolean
        default: true
      ecr_repository_name:
        description: "ECR repository for the Lambda image. When set, the image is built while the tests run and pushed once they pass; deploy it with lambda-ecr's image_prebuilt"
        required: false
        type: string
        default: ""
      architecture:
        description: "Image architecture when ecr_repository_name is set: arm64 or x86_64"
        required: false
        type: string
        default: ""
    secrets:
      go_private_modules_pat:
        required: true
      aws_access_key_id:
        required: false
      aws_secret_access_key:
        required: false
      aws_region:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pulled in the background so the download overlaps the toolchain and
      # dependency setup below instead of blocking the job ahead of the tests.
      - name: Start LocalStack Docker image pull
        if: inputs.enable_localstack
        env:
          LOCALSTACK_IMAGE: ${{ inputs.localstack_image }}
        run: |
          nohup sh -c 'docker pull "$LOCALSTACK_IMAGE" > /tmp/localstack-pull.log 2>&1; echo $? > /tmp/localstack-pull.exit' > /dev/null 2>&1 &

      # Runner images ship an older baked-in Go than what mise.toml/go.mod
      # pin. mise resolves go:-backend tool versions (e.g. sprt) by shelling
      # out to `go list -m`, which enforces the current module's go.mod floor
      # regardless of which module is queried -- on a cold mise cache, that
      # runs before mise's own pinned go tool has installed, against the
      # stale runner default, and fails with a misleading "no versions found"
      # error. Installing a go.mod-satisfying toolchain first removes the
      # race entirely.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.app_dir }}/go.mod
          # The restore/save pair below owns these directories; setup-go's own
          # cache extracts over them and keys on a Go version mise replaces.
          cache: false

      - name: Configure access to private Go modules
        env:
          GO_PRIVATE_MODULES_PAT: ${{ secrets.go_private_modules_pat }}
        run: |
          git config --global \
            url."https://understory-services:${GO_PRIVATE_MODULES_PAT}@github.com/understory-io".insteadOf \
            "https://github.com/understory-io"
          echo "GOPRIVATE=github.com/understory-io/*" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/understory-io/*" >> $GITHUB_ENV

      - name: Install Mise
        uses: jdx/mise-action@v4

      # Go caching strategy is based on https://danp.net/posts/github-actions-go-cache/
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nonexistent
          # A go.mod change misses the first key; falling back to the newest
          # cache of any go.mod keeps the build cache warm, since its entries
          # are content-addressed and stale ones are never used.
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-
            ${{ runner.os }}-go-

      - name: Download Go dependencies
        run: cd ${{ inputs.app_dir }} && go mod download -x

      # Logged in by hand: configure-aws-credentials would export the real
      # credentials over the LocalStack ones the tests rely on.
      - name: Log in to Amazon ECR
        if: inputs.ecr_repository_name != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_access_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_access_key }}
          AWS_REGION: ${{ secrets.aws_region }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "ECR_REGISTRY=$registry" >> "$GITHUB_ENV"

      # Built in the background so the binary and image are ready when the
      # tests finish. Nothing is pushed until they pass.
      - name: Start Lambda binary and image build
        if: inputs.ecr_repository_name != ''
        working-directory: ${{ inputs.app_dir }}
        env:
          GOFLAGS: "-mod=readonly"
          ECR_REPOSITORY: ${{ inputs.ecr_repository_name }}
          # Same rule as repo-data's image_tag_prefix, which lambda-ecr deploys by
          IMAGE_TAG_PREFIX: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'prod-' || 'dev-' }}
          PLATFORM: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || inputs.architecture == 'x86_64' && 'linux/amd64' || '' }}
        run: |
          cat > /tmp/image-build.sh <<'EOF'
          set -e
          mise build
          if [ "$PLATFORM" = linux/arm64 ] && [ "$(uname -m)" != aarch64 ] && [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            docker run --privileged --rm tonistiigi/binfmt --install arm64
          fi
          image="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker buildx build ${PLATFORM:+--platform "$PLATFORM"} --provenance=false \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" \
            -t "$image:$IMAGE_TAG_PREFIX$GITHUB_RUN_NUMBER" \
            -t "$image:${IMAGE_TAG_PREFIX}latest" \
            --load .
          EOF
          nohup bash -c 'bash /tmp/image-build.sh > /tmp/image-build.log 2>&1; echo $? > /tmp/image-build.exit' > /dev/null 2>&1 &

      - name: Wait for LocalStack Docker image
        if: inputs.enable_localstack
        timeout-minutes: 5
        run: |
          until [ -f /tmp/localstack-pull.exit ]; do sleep 1; done
          cat /tmp/localstack-pull.log
          exit "$(cat /tmp/localstack-pull.exit)"

      - name: Start LocalStack and run migrations
        if: inputs.enable_localstack
        run: cd ${{ inputs.app_dir }} && mise local:up

      - name: Run tests
        run: cd ${{ inputs.app_dir }} && mise test
        env:
          GOFLAGS: "-mod=readonly"

      - name: Build Lambda binary
        if: inputs.ecr_repository_name == ''
        run: cd ${{ inputs.app_dir }} && mise build
        env:
          GOFLAGS: "-mod=readonly"

      - name: Wait for Lambda binary and image build
        if: inputs.ecr_repository_name != ''
        timeout-minutes: 10
        run: |
          until [ -f /tmp/image-build.exit ]; do sleep 1; done
          cat /tmp/image-build.log
          exit "$(cat /tmp/image-build.exit)"

      - name: Push Lambda image
        if: inputs.ecr_repository_name != ''
        run: docker push --all-tags "$ECR_REGISTRY/${{ inputs.ecr_repository_name }}"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}
          include-hidden-files: true
          path: |
            ${{ inputs.app_dir }}/bin/**
            ${{ inputs.app_dir }}/Dockerfile

      - name: Trim Go build cache
        if: github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -type f -mmin +90 -delete

      - name: Set cache date
        run: echo "GO_CACHE_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: "${{ runner.os }}-go-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-${{ env.GO_CACHE_DATE }}"
