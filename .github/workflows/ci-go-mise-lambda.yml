name: CI Go Mise Lambda

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 20
      app_name:
        description: "Application name, used as the artifact name"
        required: true
        type: string
      app_dir:
        description: "Path to the application directory (e.g. apps/bookings-core)"
        required: true
        type: string
      localstack_image:
        description: "LocalStack Docker image to use"
        required: false
        type: string
        default: localstack/localstack:4.2.0
      enable_localstack:
        description: "Whether to start LocalStack for integration tests"
        required: false
        type: boolean
        default: true
      runner:
        description: "Runner label for both jobs"
        required: false
        type: string
        # Every service ships an arm64 Lambda, so this builds natively, and these
        # runners run the tests faster than ubuntu-latest's.
        default: ubuntu-24.04-arm
      # Optional: push the image and deploy from this workflow, replacing a separate
      # lambda-ecr call. The image is then built in the binary job while the tests
      # run, so a deploy no longer waits for an image build after them.
      ecr_repository_name:
        description: "ECR repository to push the Lambda image to; empty skips the image"
        required: false
        type: string
        default: ""
      image_tag_prefix:
        description: "Image tag prefix, e.g. from repo-data's image_tag_prefix output"
        required: false
        type: string
        default: ""
      architecture:
        description: "Lambda architecture for the image: arm64 or x86_64"
        required: false
        type: string
        default: arm64
      aws_function_name:
        description: "Lambda function to deploy the image to after the tests pass; empty skips the deploy"
        required: false
        type: string
        default: ""
      deploy_account_id:
        description: "AWS account to deploy into, overriding the prefix-based default (prod- -> platform-prod, otherwise platform-dev)"
        required: false
        type: string
        default: ""
    secrets:
      go_private_modules_pat:
        required: true
      aws_access_key_id:
        required: false
      aws_secret_access_key:
        required: false
      aws_region:
        required: false

# Tests and the Lambda binary run as two parallel jobs: the binary does not depend on
# the tests, and callers' `needs:` on this workflow still waits for both.
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Started first so the download overlaps Go setup and the cache restore. ECR
      # Public mirrors Docker Hub's images without its anonymous pull limits; it is
      # tagged back to the requested name, which mise.toml's local:up runs.
      - name: Pull LocalStack image in the background
        if: inputs.enable_localstack
        env:
          IMAGE: ${{ inputs.localstack_image }}
        run: |
          nohup bash -c '
            if docker pull "public.ecr.aws/$IMAGE"; then
              docker tag "public.ecr.aws/$IMAGE" "$IMAGE"
            else
              docker pull "$IMAGE"
            fi
          ' > /tmp/localstack-pull.log 2>&1 &
          echo $! > /tmp/localstack-pull.pid

      # setup-go downloads the toolchain on every run when the version is not baked
      # into the runner image; restoring it into the tool cache makes it a lookup.
      # Only that version's directory is cached, not the runner's preinstalled ones.
      - name: Resolve Go version
        id: go-version
        run: echo "version=$(sed -n 's/^go //p' ${{ inputs.app_dir }}/go.mod)" >> "$GITHUB_OUTPUT"

      - name: Restore Go toolchain
        uses: actions/cache@v5
        with:
          path: /opt/hostedtoolcache/go/${{ steps.go-version.outputs.version }}*
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}

      # Runner images ship an older baked-in Go than what mise.toml/go.mod
      # pin. mise resolves go:-backend tool versions (e.g. sprt) by shelling
      # out to `go list -m`, which enforces the current module's go.mod floor
      # regardless of which module is queried -- on a cold mise cache, that
      # runs before mise's own pinned go tool has installed, against the
      # stale runner default, and fails with a misleading "no versions found"
      # error. Installing a go.mod-satisfying toolchain first removes the
      # race entirely.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.app_dir }}/go.mod
          # The restore/save pair below owns these directories; setup-go's own
          # cache extracts over them and keys on a Go version mise replaces.
          cache: false

      - name: Configure access to private Go modules
        env:
          GO_PRIVATE_MODULES_PAT: ${{ secrets.go_private_modules_pat }}
        run: |
          git config --global \
            url."https://understory-services:${GO_PRIVATE_MODULES_PAT}@github.com/understory-io".insteadOf \
            "https://github.com/understory-io"
          echo "GOPRIVATE=github.com/understory-io/*" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/understory-io/*" >> $GITHUB_ENV

      - name: Install Mise
        uses: jdx/mise-action@v4

      # Go caching strategy is based on https://danp.net/posts/github-actions-go-cache/
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nonexistent
          # The last key ignores go.mod, so a dependency bump starts from main's latest
          # build instead of from nothing; Go only reuses entries whose inputs match.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Download Go dependencies
        run: cd ${{ inputs.app_dir }} && go mod download -x

      - name: Start LocalStack and run migrations
        if: inputs.enable_localstack
        run: |
          while kill -0 "$(cat /tmp/localstack-pull.pid)" 2>/dev/null; do sleep 1; done
          cat /tmp/localstack-pull.log
          cd ${{ inputs.app_dir }} && mise local:up

      - name: Run tests
        run: cd ${{ inputs.app_dir }} && mise test
        env:
          GOFLAGS: "-mod=readonly"
          # The race detector otherwise sleeps a second before every test binary
          # exits, which is most of the run time of a service with many packages.
          GORACE: "atexit_sleep_ms=0"

      # Saved on every run, PRs included, under a key per run: a PR's next push then
      # restores its own build rather than main's, which can be a day older and
      # recompiles everything the PR touched. The trim keeps only what this run used.
      - name: Trim Go build cache
        run: find ~/.cache/go-build -type f -mmin +90 -delete

      - name: Save Go cache
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: "${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-${{ github.run_id }}-${{ github.run_attempt }}"

  binary:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve Go version
        id: go-version
        run: echo "version=$(sed -n 's/^go //p' ${{ inputs.app_dir }}/go.mod)" >> "$GITHUB_OUTPUT"

      - name: Restore Go toolchain
        uses: actions/cache/restore@v5
        with:
          path: /opt/hostedtoolcache/go/${{ steps.go-version.outputs.version }}*
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-version.outputs.version }}

      # See the build job for why this precedes mise.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.app_dir }}/go.mod
          cache: false

      - name: Configure access to private Go modules
        env:
          GO_PRIVATE_MODULES_PAT: ${{ secrets.go_private_modules_pat }}
        run: |
          git config --global \
            url."https://understory-services:${GO_PRIVATE_MODULES_PAT}@github.com/understory-io".insteadOf \
            "https://github.com/understory-io"
          echo "GOPRIVATE=github.com/understory-io/*" >> $GITHUB_ENV
          echo "GONOSUMDB=github.com/understory-io/*" >> $GITHUB_ENV

      - name: Install Mise
        uses: jdx/mise-action@v4

      # Its own key, because this job compiles for the Lambda's architecture and
      # without -race, which the test job's cache barely covers. It falls back to the
      # test job's entry until main has saved one.
      - name: Restore Go cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: nonexistent
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-binary-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-
            ${{ runner.os }}-${{ runner.arch }}-go-binary-

      - name: Build Lambda binary
        run: cd ${{ inputs.app_dir }} && mise build
        env:
          GOFLAGS: "-mod=readonly"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}
          include-hidden-files: true
          path: |
            ${{ inputs.app_dir }}/bin/**
            ${{ inputs.app_dir }}/Dockerfile

      # Saved on every run, PRs included, under a key per run: a PR's next push then
      # restores its own build rather than main's, which can be a day older and
      # recompiles everything the PR touched. The trim keeps only what this run used.
      - name: Trim Go build cache
        run: find ~/.cache/go-build -type f -mmin +90 -delete

      - name: Save Go cache
        uses: actions/cache/save@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: "${{ runner.os }}-${{ runner.arch }}-go-binary-${{ hashFiles(format('{0}/go.mod', inputs.app_dir)) }}-${{ github.run_id }}-${{ github.run_attempt }}"

  # Its own job, not steps in binary: mise-action exports each app's mise.toml [env]
  # into the job, and apps that point AWS_ENDPOINT_URL and credentials at LocalStack
  # would send the ECR login there. It still runs alongside the tests.
  image:
    if: inputs.ecr_repository_name != ''
    needs: [binary]
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app_name }}

      # Pushed under the commit sha only. The tags anything else reads (<prefix>latest
      # and <prefix><run>) are added by the publish job, after the tests pass.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the Lambda image
        uses: docker/build-push-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: true
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          provenance: false
          # Lets the image report service.version in telemetry. Baked into the image because
          # Terraform owns the function's env vars and does not re-apply on deploy.
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository_name }}:${{ github.sha }}

  # Runs once both the tests and the image are done: tags the tested image the way
  # lambda-ecr does, which is a manifest copy rather than a rebuild, and deploys it.
  publish:
    if: inputs.ecr_repository_name != ''
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag the tested image
        env:
          REPOSITORY: ${{ inputs.ecr_repository_name }}
          PREFIX: ${{ inputs.image_tag_prefix }}
        run: |
          manifest=$(aws ecr batch-get-image --repository-name "$REPOSITORY" \
            --image-ids imageTag=${{ github.sha }} \
            --accepted-media-types application/vnd.docker.distribution.manifest.v2+json application/vnd.oci.image.manifest.v1+json \
            --query 'images[0].imageManifest' --output text)
          for tag in "${PREFIX}${{ github.run_number }}" "${PREFIX}latest"; do
            # put-image refuses a tag that already points at this manifest; that is fine.
            aws ecr put-image --repository-name "$REPOSITORY" --image-tag "$tag" \
              --image-manifest "$manifest" > /dev/null 2> /tmp/put-image.err \
              || grep -q ImageAlreadyExistsException /tmp/put-image.err \
              || { cat /tmp/put-image.err; exit 1; }
          done

      - name: Setup aws role arn
        if: inputs.aws_function_name != ''
        env:
          IMAGE_TAG_PREFIX: ${{ inputs.image_tag_prefix }}
          DEPLOY_ACCOUNT_ID: ${{ inputs.deploy_account_id }}
        run: |
          if [ -n "$DEPLOY_ACCOUNT_ID" ]; then
            ROLE_ARN="arn:aws:iam::${DEPLOY_ACCOUNT_ID}:role/ContinuousDeliveryRole"
          elif [ "$IMAGE_TAG_PREFIX" = "prod-" ]; then
            ROLE_ARN="arn:aws:iam::189949407637:role/ContinuousDeliveryRole"
          else
            ROLE_ARN="arn:aws:iam::115578597962:role/ContinuousDeliveryRole"
          fi
          echo "ROLE_TO_ASSUME=$ROLE_ARN" >> $GITHUB_ENV

      - name: Assume the deploy role
        if: inputs.aws_function_name != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-duration-seconds: 900

      - name: Update lambda image uri
        if: inputs.aws_function_name != ''
        run: |
          if aws lambda get-function --function-name ${{ inputs.aws_function_name }} > /dev/null 2>&1; then
            aws lambda update-function-code --function-name ${{ inputs.aws_function_name }} --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository_name }}:${{ inputs.image_tag_prefix }}latest
          else
            echo "Function ${{ inputs.aws_function_name }} does not exist; skipping the deploy."
          fi
