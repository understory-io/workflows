on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 10
      publish-command:
        type: string
        required: true

      releases-name:
        type: string
        description: 'Name shown in slack message. Defaults to repository name'
        default: ${{ github.event.repository.name }}
      releases-name-subtitle:
        type: string
        description: 'Appended after release name'
        default: New packages released
      mono-repo:
        type: boolean
        description: 'Whether the repository is a mono-repo or not'
      commit-message:
        type: string
        description: 'The commit message to use. Default to Version Packages'
        default: Version Packages
      pull-request-title:
        type: string
        description: 'Default to Version Packages'
        default: Version Packages
    secrets:
      slack-webhook:
        required: true
      github_ssh_key:
        description: 'SSH key to use for git operations like referencing packages referenced by git urls'
        required: false
      changeset-github-token:
        required: true
      go-private-modules-pat:
        required: false
        description: 'GitHub PAT to access private Go modules'
    outputs:
      published:
        description: 'Whether a new release was published or not'
        value: ${{ jobs.changeset-releases.outputs.published }}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  changeset-releases:
    name: Changeset Releases
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.github_ssh_key }}
          fetch-depth: 2

      - name: Setup access to private Go modules
        env:
          GO_PRIVATE_MODULES_PAT: ${{ secrets.go-private-modules-pat }}
        run: |
          git config --global \
            url."https://understory-services:${GO_PRIVATE_MODULES_PAT}@github.com/understory-io".insteadOf \
            "https://github.com/understory-io"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          node-version: 22.x
          registry-url: 'https://npm.pkg.github.com'

      - name: Setup SSH Agent
        env:
          SSH_KEY: ${{ secrets.github_ssh_key }}
        if: env.SSH_KEY != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.github_ssh_key }}

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git User
        # Repos that set `commit: true` in .changeset/config.json have the CLI
        # commit the version bump itself, and git refuses to commit without an
        # identity. The action pushes through the GitHub API, so what lands on
        # the branch is attributed to the token owner regardless of this.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Release Pull Request or publish changesets
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: ${{ inputs.publish-command }}
          commit-message: ${{ inputs.commit-message }}
          pr-title: ${{ inputs.pull-request-title }}
          github-token: ${{ secrets.changeset-github-token }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release reached the registry
        # The action reports `published: false` both when there was nothing to
        # publish and when it could not read the publish result at all — with a
        # custom publish script the latter is only a warning, so a release can
        # reach the registry, skip everything gated on the output, and still
        # report green. Any version this commit bumped must therefore resolve.
        if: steps.changesets.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            echo "No previous commit to compare against; nothing to verify."
            exit 0
          fi

          missing=""
          for file in $(git diff --name-only 'HEAD^' HEAD -- '*/package.json' 'package.json'); do
            [ -f "$file" ] || continue

            entry=$(jq -r 'select((.private | not) and .name and .version) | "\(.name) \(.version)"' "$file")
            [ -n "$entry" ] || continue
            name=${entry%% *}
            version=${entry##* }

            # A package added in this commit has no previous version to compare.
            previous=$(git show "HEAD^:$file" 2>/dev/null | jq -r '.version // ""') || previous=""
            [ "$version" != "$previous" ] || continue

            # A package the registry cannot resolve at all is an access problem,
            # not a missed publish, and must not turn a quiet run red.
            if ! published=$(npm view "$name" versions --json 2>/dev/null); then
              echo "::warning::Could not read $name from the registry; skipping."
              continue
            fi

            # `npm view` yields a bare string when only one version exists.
            if [ "$(jq --arg v "$version" '[.] | flatten | any(. == $v)' <<<"$published")" != "true" ]; then
              missing="$missing  $name@$version"$'\n'
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::This commit bumped versions that never reached the registry, but the release reported nothing published:"
            printf '%s' "$missing"
            exit 1
          fi

      - name: Extract release notes
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releasesNotes=""

          while IFS= read -r package; do
            # Construct tag from package name and version
            # https://github.com/changesets/changesets/blob/main/docs/command-line-options.md#tag

            if [ "${{ inputs.mono-repo }}" = "true" ]; then
              tag=$(echo "$package" | jq -r '.name + "@" + .version')
            else
              tag=$(echo "$package" | jq -r '"v" + .version')
            fi

            notes=$(gh release view "$tag" --json body -q '.body' || echo "No release notes available for $tag")

            # Convert GitHub-style markdown to Slack markdown for proper links
            formattedNotes=$(echo "$notes" | sed -E 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g')

            # jq adds quotes around the final string when using --raw-output and
            # --ascii-output. We remove them again with sed.
            escapedNotes=$(echo "$formattedNotes" | jq --raw-output --raw-input --slurp --ascii-output | sed -e 's/^"//' -e 's/"$//')

            # Append the formatted notes to the releasesNotes
            releasesNotes="${releasesNotes}\n*$tag*:\n\n${escapedNotes}\n\n"
          done < <(echo '${{ steps.changesets.outputs['published-packages'] }}' | jq -c '.[]')

          # Use the multiline syntax to export RELEASES_NOTES
          echo "RELEASES_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "$releasesNotes" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Notify Slack
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@v3.0.1
        env:
          RELEASES_NOTES: ${{ env.RELEASES_NOTES }}
        with:
          webhook: ${{ secrets.slack-webhook }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ inputs.releases-name }}:* ${{ inputs.releases-name-subtitle }}\n\n${{ env.RELEASES_NOTES }}"
                  }
                }
              ]
            }
