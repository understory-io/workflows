name: "Build & Push Image"

on:
  workflow_call:
    inputs:
      timeout_minutes:
        description: "Max minutes before the job is cancelled (override the measured default)"
        type: number
        required: false
        default: 10
      ecr_repository_name:
        type: string
        required: true
      aws_function_name:
        type: string
        required: false
      image_tag_prefix:
        type: string
        required: true
      artifacts_name:
        type: string
        required: true
      architecture:
        type: string
        required: false
        description: "The architecture to build for. This can be either arm64 or x86_64"
      deploy_account_id:
        type: string
        required: false
        default: ""
        description: "AWS account id to assume into for the lambda deploy step. Overrides the prefix-based default (prod- → platform-prod, otherwise platform-dev). Use when the function lives in an account that doesn't match the image tag convention."
    secrets:
      aws_access_key_id:
        required: true
      aws_secret_access_key:
        required: true
      aws_region:
        required: true

jobs:
  build:
    name: "Build & Push Image"
    # A native runner for the image's architecture, so its RUN steps do not go
    # through QEMU.
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      image_repo: ${{ inputs.ecr_repository_name }}
      image_tag: ${{ inputs.image_tag_prefix }}latest
    steps:
      - name: Download a single artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifacts_name }}

      - name: Build Docker Image, tag, and push image to Amazon ECR
        uses: understory-io/workflows/.github/actions/docker-build@main
        with:
          image_tag_prefix: ${{ inputs.image_tag_prefix }}
          app_path: ./
          platform: ${{ inputs.architecture == 'arm64' && 'linux/arm64' || inputs.architecture == 'x86_64' && 'linux/amd64' || '' }}

          ecr_repository_name: ${{ inputs.ecr_repository_name }}
          aws_access_key_id: ${{ secrets.aws_access_key_id }}
          aws_secret_access_key: ${{ secrets.aws_secret_access_key }}
          aws_region: ${{ secrets.aws_region }}

      # The deploy runs in this job rather than a job of its own: a second job only
      # added a runner start and teardown to every deploy.
      - name: Login to Amazon ECR
        if: inputs.aws_function_name != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup aws role arn
        if: inputs.aws_function_name != ''
        id: setup-aws-role-arn
        env:
          IMAGE_TAG_PREFIX: ${{ inputs.image_tag_prefix }}
          DEPLOY_ACCOUNT_ID: ${{ inputs.deploy_account_id }}
        run: |
          if [ -n "$DEPLOY_ACCOUNT_ID" ]; then
            ROLE_ARN="arn:aws:iam::${DEPLOY_ACCOUNT_ID}:role/ContinuousDeliveryRole"
          elif [ "$IMAGE_TAG_PREFIX" = "prod-" ]; then
            ROLE_ARN="arn:aws:iam::189949407637:role/ContinuousDeliveryRole"
          else
            ROLE_ARN="arn:aws:iam::115578597962:role/ContinuousDeliveryRole"
          fi

          echo "ROLE_TO_ASSUME=$ROLE_ARN" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: inputs.aws_function_name != ''
        env:
          ROLE_TO_ASSUME: ${{ env.ROLE_TO_ASSUME }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.aws_access_key_id }}
          aws-secret-access-key: ${{ secrets.aws_secret_access_key }}
          aws-region: ${{ secrets.aws_region }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-duration-seconds: 900

      - name: Check if lambda function exists
        if: inputs.aws_function_name != ''
        id: check_lambda
        run: |
          if aws lambda get-function --function-name ${{ inputs.aws_function_name }} > /dev/null 2>&1; then
            echo "LAMBDA_EXISTS=true" >> $GITHUB_ENV
          else
            echo "LAMBDA_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Update lambda image uri
        env:
          LAMBDA_EXISTS: ${{ env.LAMBDA_EXISTS }}
          FUNCTION_NAME: ${{ inputs.aws_function_name }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository_name }}:${{ inputs.image_tag_prefix }}latest
        if: inputs.aws_function_name != '' && env.LAMBDA_EXISTS == 'true'
        # Runs that deploy the same function close together (several Renovate
        # PRs against the shared dev function) collide: Lambda rejects an
        # update while another is in progress (ResourceConflictException).
        # Only that error is worth waiting out; any other is a real failure.
        # Waits are bounded so three attempts fit inside the job timeout.
        # test/lambda-ecr.mjs finds this step by its name.
        run: |
          for attempt in 1 2 3; do
            timeout 90 aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME" || true
            rc=0
            output=$(aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_URI" 2>&1) || rc=$?
            printf '%s\n' "$output"
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if ! grep -q 'An error occurred (ResourceConflictException)' <<< "$output"; then
              exit "$rc"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Another update of $FUNCTION_NAME is in progress; waiting for it, then retrying (attempt $attempt of 3)."
            fi
          done
          echo "Another update of $FUNCTION_NAME was still in progress after 3 attempts; giving up."
          exit "$rc"
