name: "Image exists"

# The action's whole job is to refuse a missing image, so the check that
# matters is that it fails on one; a broken inspect call would otherwise
# pass every release it was meant to stop.

on:
  pull_request:
    paths:
      - ".github/actions/image-exists/**"
      - ".github/workflows/image-exists.yml"
  push:
    branches:
      - main
    paths:
      - ".github/actions/image-exists/**"
      - ".github/workflows/image-exists.yml"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: An image that exists resolves to a digest
        id: present
        uses: ./.github/actions/image-exists
        with:
          image: docker.io/library/alpine:3.20

      - name: An image that was never pushed is refused
        id: missing
        continue-on-error: true
        uses: ./.github/actions/image-exists
        with:
          image: docker.io/library/alpine:never-pushed-0000000
          attempts: "1"

      - name: Check the outcomes
        env:
          DIGEST: ${{ steps.present.outputs.digest }}
          MISSING: ${{ steps.missing.outcome }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest for a present image: '$DIGEST'"; exit 1 ;; esac
          [ "$MISSING" = failure ] || { echo "::error::a missing image was not refused ($MISSING)"; exit 1; }
